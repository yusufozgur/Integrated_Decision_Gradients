[project]
name = "integrated-decision-gradients"
version = "0.1.0"
description = "Integrated Decision Gradients is an attribution method that improves upon Integrated Gradients by concentrating attribution mass in the region where the model actually makes its decision."
readme = "README.md"
authors = [
    { name = "Yusuf Turhan", email = "yusufozgurtr@gmail.com" }
]
requires-python = ">=3.10"
license = { text = "MIT" } 
keywords = ["explainability", "attribution", "deep learning", "XAI"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
[project.urls]
Repository = "https://github.com/yusufozgur/integrated-decision-gradients"
dependencies = [
    "captum>=0.9.0",
    "numpy>=2.2.6",
    "torch>=2.3",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "marimo>=0.23.5",
    "matplotlib>=3.10.9",
]
